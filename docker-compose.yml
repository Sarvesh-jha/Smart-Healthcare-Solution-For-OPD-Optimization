version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/medirxcare
      PORT: 5001
      NODE_ENV: production
      JWT_SECRET: production-super-secret-key-replace-in-production-123456789
      CORS_ORIGIN: http://localhost:8080,http://localhost:4173
    ports:
      - "5001:5001"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
